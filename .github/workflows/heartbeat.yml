name: Heartbeat

# tasks.md 27.5 — «no se puede ver el consumo, así que se vigila la
# consecuencia». El primer workflow programado del repositorio: verificado
# que `.github/workflows/ci.yml` es el único que existía, y no tenía ni
# `schedule` ni `workflow_dispatch`.
#
# **Cadencia real: cada 2 a 7 horas, no cada 5 minutos.** El cron pide
# `*/5` (decisión del fundador, 2026-09-07), pero GitHub no garantiza los
# horarios programados. Medido el 2026-11-01: 40 corridas en 7,7 días, con
# separaciones de 119 a 433 minutos (mediana 276). Ésta es la única
# vigilancia periódica de la base; la de la aplicación cada 5 minutos es el
# monitor externo sobre /api/live (docs/production-rollback.md).
#
# **No conviene que corra de verdad cada 5 minutos.** Cada corrida despierta
# el cómputo de Neon, que en el plan Free se suspende tras 5 minutos sin
# uso. A esa cadencia quedaría despierto todo el mes (~180 CU-h, más que las
# 100 del plan) y sólo por vigilar. Así cayó producción el 2026-10-26. El
# costo en datos sí es despreciable: /api/health toca listCities(), 5 filas
# y 349 bytes (tasks.md 27.1).
#
# `workflow_dispatch` está para lo que un workflow sólo-programado no puede
# dar: verificarlo a mano sin esperar la próxima corrida.
#
# Secretos de repositorio que este workflow necesita (README/fundador):
# RESEND_API_KEY, HEARTBEAT_MAIL_FROM, HEARTBEAT_MAIL_TO.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Preguntarle a producción si está viva
        env:
          HEARTBEAT_URL: https://rentoru.com/api/health
          HEARTBEAT_MAIL_TO: ${{ secrets.HEARTBEAT_MAIL_TO }}
          HEARTBEAT_MAIL_FROM: ${{ secrets.HEARTBEAT_MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: pnpm run heartbeat
