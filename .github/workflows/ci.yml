name: CI

# CI minutes are metered on this private repository (design.md, "Continuous
# Integration") — Actions minutes come from a monthly quota, not the free
# unlimited tier public repos get. Cheap gates that need no deployment run
# on pull requests into dev/staging/main. The expensive half — E2E,
# crawlability, measurement and budgets — runs on pushes to dev/staging.
# Only Lighthouse needs the exact commit's deployed preview.
# Full remains the default on dev and mandatory on staging. Enable the optional
# CI_DEV_PROFILE=critical repository variable only after validating the staging
# replacement and the promotion prerequisites; this file does not enable it.
# Critical dev keeps isolated publication/authentication and selects public reads.
#
# No repository variable is required to discover deployment URLs.
#
#   - The preview URL is resolved at run time from GitHub's Deployments API,
#     which Vercel populates. Nothing to keep in sync by hand.
#   - The `integration` and `e2e` jobs each get their own ephemeral Postgres
#     container, local to the job and never the production Neon database.
#   - The `build` job uses a deliberately fake, unroutable DATABASE_URL.
#
# E2E always uses the job-owned local catalogue, never a Vercel database.
# Remote Lighthouse requires VERCEL_AUTOMATION_BYPASS_SECRET; missing access
# fails closed rather than reporting an unmeasured deployment as passing.

on:
  push:
    branches: [dev, staging]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The `preview` job reads Vercel's deployment status for the commit under
  # test rather than constructing a URL from a project slug.
  deployments: read

env:
  NODE_VERSION: "22"
  # Kept in lockstep with package.json's "packageManager" field. Pinned to
  # the pnpm 10 line on purpose: Vercel's build image does not recognize
  # pnpm 11 (see package.json's devEngines comment), and local, CI, and
  # Vercel must all resolve the same pnpm major or lockfile parsing drifts
  # silently between environments.
  PNPM_VERSION: "10.34.5"

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  types:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint-tokens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tokens

  # Unit tests and the 90% domain/application coverage floor share one run:
  # `test:coverage` already executes every unit test, so a second bare
  # `test:unit` pass would just burn minutes re-running the same specs.
  # A failing test and a threshold violation are still distinguishable from
  # this job's own output.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests + coverage floor (90% domain/application)
        run: pnpm test:coverage

  # Added after a production deploy failed on `Module not found: '@/...'`
  # while every existing gate was green. Nothing in the gate set compiled the
  # application, so a whole class of failure — module resolution, bundler
  # config, server/client boundary violations — could only ever be discovered
  # by deploying. Type-checking is not building.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # src/shared/db/client.ts resolves and validates DATABASE_URL at module
      # load, so the build needs one present. This value is deliberately fake
      # and unroutable: the build must never touch a real database, but it must
      # still exercise assertPooledConnectionString, so a change that breaks the
      # pooled-endpoint guard fails here rather than at deploy time.
      DATABASE_URL: postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require
      AUTH_SECRET: build-time-placeholder-not-a-real-secret
      # `robots.txt` and `sitemap.xml` are PRERENDERED, so `readSiteBaseUrl`
      # runs during the build and not only at request time. Since task 26.10
      # removed its hardcoded production fallback it fails closed (AGENTS.md
      # §7), and without this the export dies on /robots.txt. Vercel needs no
      # equivalent: it sets VERCEL_URL in the build environment, and the real
      # SITE_URL is configured there (26.20). Fixed and fake for the same
      # reason as the two above — a build must not depend on the live domain.
      SITE_URL: https://ci-build-no-es-el-dominio-real.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Layout-measurement harness (tasks.md 1b.10-1b.12, 1b.14). Runs on every
  # push to dev/staging alongside e2e/budget: it needs a Next.js build and
  # a real browser, but no deployed preview (its webServer runs `next dev`).
  measure:
    if: github.event_name == 'push' && (github.ref != 'refs/heads/dev' || vars.CI_DEV_PROFILE != 'critical')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same cache the e2e job carries. Adding it there and not here is
      # why this job kept hanging on the browser download while e2e dropped
      # to 1m41s -- one fix applied to one of the two places that needed it.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps on every path: the apt libraries it installs do not live
      # in that cache, so a hit without them leaves a browser that cannot
      # start.
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test scripts/measure-trace.test.cjs
      - id: measure
        run: pnpm test:measure

      - name: Preserve failed local measure traces
        if: ${{ !cancelled() && steps.measure.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: measure-traces-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/**/trace.zip
          if-no-files-found: warn
          retention-days: 3

  integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to 18: the live Neon instance was verified at
        # server_version 18.4 on 2026-08-16. An emulator or a different
        # major version would not exercise the bit_count/composite-FK
        # behaviour this layer exists to test (design.md, "Testing
        # Strategy": "Integration tests must use real Postgres").
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    env:
      # Deliberately not DATABASE_URL: src/shared/db/client.ts only accepts
      # Neon's pooled HTTP endpoint (assertPooledConnectionString requires
      # a "-pooler." hostname), which this bare container can never satisfy.
      # Future integration specs connect with a direct Postgres driver
      # against TEST_DATABASE_URL instead of the app's Neon-only client.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Confirm the service container is really Postgres 18
        run: |
          version=$(psql "$TEST_DATABASE_URL" -tAc "SHOW server_version;")
          echo "server_version: $version"
          case "$version" in
            18*) ;;
            *) echo "::error::expected Postgres 18, got $version"; exit 1 ;;
          esac

      # Applies the same generated migrations (drizzle/) the app ships, so
      # the constraints under test — zone's UNIQUE(id, city_id), D5 — are
      # the real shipped schema, not a hand-rolled copy that could drift.
      # DATABASE_URL is set only for this step: drizzle-kit's own CLI reads
      # it from dbCredentials and has no pooled-endpoint requirement (that
      # guard lives in src/shared/db/client.ts, the app runtime, not here).
      - name: Apply migrations to the test container
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Integration tests
        run: |
          # `if cmd` rather than `out=$(cmd); code=$?` on purpose: Actions runs
          # these steps under `bash -e`, where a failing command substitution
          # in an assignment aborts the step before the next line executes —
          # which would make the branch below unreachable dead code.
          if output=$(pnpm test:integration 2>&1); then
            echo "$output"
            if echo "$output" | grep -qi "no test files found"; then
              echo "::warning title=Integration gate has no specs yet::tests/integration/ is empty (tasks.md Phase 2+). This step currently cannot fail — it only proves the pipeline and the Postgres 18 container wiring, not any integration behaviour."
            fi
          else
            echo "$output"
            exit 1
          fi

  # E2E and crawlability share a job: same install, same spec files, only
  # the Playwright project differs (crawlability runs with scripting off —
  # playwright.config.ts).
  #
  # The preview URL is READ from GitHub's Deployments API, not constructed
  # from a project/scope slug. Vercel posts the exact `environment_url` for
  # the commit under test, so this needs no repository variable to keep in
  # sync, survives a project rename, and — unlike the deterministic branch
  # alias — cannot be silently wrong when a long branch name pushes the
  # hostname past the 63-character DNS label limit and Vercel truncates it.
  # It also solves the race: Actions routinely starts before Vercel finishes,
  # so the step waits for a `success` status rather than testing a 404.
  # Resolved once and shared, rather than repeated in both consumers: two
  # copies of a wait loop drift, and the second copy is the one nobody
  # notices is broken.
  preview:
    if: github.event_name == 'push' && (github.ref != 'refs/heads/dev' || vars.CI_DEV_PROFILE != 'critical')
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel preview deployment
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/wait-for-preview.sh

  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # **El arnés que le devuelve los dientes al proyecto `crawlability`**
    # (tasks.md 11.22). Hasta acá este job compilaba contra una DATABASE_URL
    # deliberadamente inalcanzable, asi que todo lo que lee el catalogo —el
    # camino de lectura entero— solo podia contestar 500, y siete
    # especificaciones se saltaban solas. El job instalaba un navegador, corria
    # varios minutos y no podia fallar.
    #
    # La causa era estructural: la aplicacion habla el HTTP de Neon, no el
    # protocolo de cable de Postgres. `scripts/neon-http-proxy.mjs` traduce uno
    # al otro contra este contenedor, y `scripts/seed-e2e.ts` le pone dos
    # ciudades con fotos. La aplicacion no cambia una linea, y
    # `assertPooledConnectionString` no se debilita.
    #
    # Ahora corre tras actualizar dev/staging, siempre contra este contenedor.
    services:
      postgres:
        # El mismo 18 que el job `integration` y que la instancia de Neon.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser download is this job's slowest and least reliable step: it
      # once hung for nineteen minutes and had to be killed by hand. The key
      # carries the pinned Playwright version, so an upgrade misses the cache
      # and re-downloads rather than silently running the wrong browser.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` runs on every path, cache hit or not: the system
      # libraries it installs through apt do NOT live in ~/.cache/ms-playwright,
      # so skipping it on a hit would leave a cached browser that cannot start.
      # The cache saves the ~150 MB download, which is the slow half.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Las mismas migraciones generadas que la aplicacion despacha, para que la
      # suite corra contra el esquema real y no contra una copia a mano.
      # DATABASE_URL se pone SOLO en este paso: el CLI de drizzle-kit no tiene
      # la exigencia del endpoint agrupado, que vive en el runtime de la
      # aplicacion (src/shared/db/client.ts) y no acá.
      - name: Apply migrations to the e2e container
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:migrate

      # Dos ciudades, cuatro zonas, avisos con portada y uno vencido. Poco y
      # fijo: una suite que depende de estado acumulado pasa por razones que
      # nadie puede reproducir.
      - name: Seed the deterministic e2e catalogue
        run: pnpm db:test:seed:e2e

      # This preservation fixture needs the seed publisher still draft-free.
      # Keep it before all general suites, local only, with no ambient worker DB.
      # Only the build gets a fake pooled URL; webServer supplies its own DB/proxy.
      - name: '36.3: publication entry (local production build)'
        env:
          PLAYWRIGHT_BASE_URL: ''
          VERCEL_AUTOMATION_BYPASS_SECRET: ''
          AUTH_URL: http://localhost:3001
          AUTH_TRUST_HOST: 'true'
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          SITE_URL: http://localhost:3001
          R2_BUCKET_PUBLIC_URL: http://localhost:3001
          PLAYWRIGHT_PORT: '3001'
          NEON_PROXY_PORT: '55436'
          PLAYWRIGHT_WEB_COMMAND: pnpm start --port 3001
        run: |
          DATABASE_URL=postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require pnpm build
          env -u DATABASE_URL pnpm exec playwright test tests/e2e/publicar-entrada.spec.ts --project=chromium --workers=1 --retries=0
          env -u DATABASE_URL pnpm exec playwright test tests/e2e/publicar-entrada.spec.ts --project=crawlability --workers=1 --retries=0

      # Always exercise the seeded job-owned app, not the remote deployment.
      - name: E2E + crawlability
        env:
          READ_PROFILE: ${{ github.ref == 'refs/heads/dev' && vars.CI_DEV_PROFILE == 'critical' && 'critical' || 'full' }}
          PLAYWRIGHT_BASE_URL: ''
          VERCEL_AUTOMATION_BYPASS_SECRET: ''
          # The same deliberately fake, unroutable value the build job carries,
          # and for the same reason: src/shared/db/client.ts resolves and
          # validates DATABASE_URL at module load ON PURPOSE, so a change that
          # breaks the pooled-endpoint guard fails in CI rather than at deploy
          # time. Without it the local production build this suite falls back to
          # cannot collect /api/auth/[...nextauth] and never starts.
          DATABASE_URL: postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require
          # Not a secret and never used to sign anything real: it exists so the
          # local fallback build can REJECT a forged renewal token instead of
          # answering 500 "falta el secreto". Without it `renewal-link.spec.ts`
          # can only prove the route fails closed, which is the weaker half of
          # what it is there to prove (tasks.md 7.12).
          RENEWAL_TOKEN_SECRET: e2e-fake-secret-signs-nothing-real
          # Igual que arriba: desde la 26.10 `readSiteBaseUrl` falla cerrado, y
          # `robots.txt` y `sitemap.xml` se prerenderizan, así que el `pnpm
          # build` local de este job no termina sin ella.
          SITE_URL: https://ci-build-no-es-el-dominio-real.invalid
          # El origen público de las fotos. Hasta que 11.22 encendió las
          # especificaciones que dibujan avisos, este job no lo necesitaba: todo
          # lo que leía el catálogo se saltaba solo. Al prenderlas apareció la
          # dependencia que el skip escondía, y `listing-discovery` se NIEGA a
          # construir una URL de foto sin ella (falla cerrado, AGENTS.md §7) en
          # vez de emitir una rota.
          #
          # Valor fijo y falso a propósito: estas pruebas afirman que la foto
          # está en el HTML servido, nunca que la imagen cargue. Un origen real
          # ataría la suite a un bucket, y un bucket vacío la pondría roja por
          # algo que no es el código.
          #
          # **Sólo ésta se agrega.** Las otras que el job no define
          # —CRON_SECRET, OPERATOR_SECRET, RESEND_API_KEY, el resto de R2—
          # quedan ausentes a propósito: sus rutas fallan cerradas sin ellas, y
          # eso es justo lo que sus especificaciones miden. Dárselas taparía la
          # afirmación.
          R2_BUCKET_PUBLIC_URL: https://fotos-de-prueba.rentas.invalid
          PLAYWRIGHT_WEB_COMMAND: pnpm start
        run: |
          # Built once here rather than by each project's webServer. The two
          # projects run as separate `playwright test` invocations, so each was
          # starting its own server and compiling the whole application again:
          # one 8m5s job doing a 50-second build twice. PLAYWRIGHT_WEB_COMMAND
          # tells the config to serve what this step already produced.
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            pnpm build
          fi
          if [ "$READ_PROFILE" = "critical" ]; then
            pnpm test:e2e:critical:read
            exit $?
          fi
          fail=0
          # `if cmd` rather than capturing $? after an assignment: Actions runs
          # these steps under `bash -e`, where a failing command substitution
          # aborts the step immediately. Capturing the status afterwards never
          # runs, so both the loop and the "no tests yet" tolerance below would
          # be dead code and one real failure would skip the remaining project.
          for project in chromium crawlability; do
            if output=$(pnpm exec playwright test --project="$project" --grep-invert='29\.2:|30\.2:|30\.3|30\.4b2:|30\.5b2c:|30\.6c:|30\.7:|36\.3:' 2>&1); then
              echo "$output"
            else
              echo "$output"
              # No "no tests found" tolerance any more. It existed while
              # tests/e2e/ was empty, and it meant this job installed a
              # browser, ran for minutes and could not fail -- reported as a
              # passing gate on every push. An emptied directory is now a
              # failure, because that is what it is.
              fail=1
            fi
          done
          exit $fail

      # The listing and missing-route diagnostics need the seeded local catalogue
      # just like the main suite. Run them before pagination changes those six
      # rows, and never send them to the preview.
      - name: 30.2–30.4 served listing and route diagnostics (local production build)
        env:
          PLAYWRIGHT_BASE_URL: ''
          VERCEL_AUTOMATION_BYPASS_SECRET: ''
          DATABASE_URL: postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          RENEWAL_TOKEN_SECRET: e2e-fake-secret-signs-nothing-real
          SITE_URL: https://ci-build-no-es-el-dominio-real.invalid
          R2_BUCKET_PUBLIC_URL: https://fotos-de-prueba.rentas.invalid
          PLAYWRIGHT_WEB_COMMAND: pnpm start
        run: |
          pnpm build
          pnpm exec playwright test tests/e2e/ficha-diagnostico.spec.ts tests/e2e/ficha-rutas.spec.ts --project=chromium --project=crawlability

      # Authenticated logout needs the owned local session table, not the preview.
      # Build with a fake pooled URL, then start with Playwright's local DB proxy.
      - name: 30.4b2–30.7 authenticated contact and door (local production build)
        env:
          PLAYWRIGHT_BASE_URL: ''
          VERCEL_AUTOMATION_BYPASS_SECRET: ''
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: 'true'
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          RENEWAL_TOKEN_SECRET: e2e-fake-secret-signs-nothing-real
          SITE_URL: https://ci-build-no-es-el-dominio-real.invalid
          R2_BUCKET_PUBLIC_URL: https://fotos-de-prueba.rentas.invalid
          PLAYWRIGHT_WEB_COMMAND: pnpm start
        run: |
          DATABASE_URL=postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require pnpm build
          pnpm exec playwright test tests/e2e/ficha-logout.spec.ts --project=chromium
          pnpm exec playwright test tests/e2e/ficha-contacto-revelacion.spec.ts --project=chromium --project=crawlability --workers=1
          pnpm exec playwright test tests/e2e/reporte-con-motivo.spec.ts --project=chromium --project=crawlability --workers=1
          pnpm exec playwright test tests/e2e/puerta-cierre.spec.ts tests/e2e/puerta-de-whatsapp-sin-javascript.spec.ts --project=chromium --project=crawlability --workers=2

      # Append only after the six-row suite succeeds. Never point this step at
      # the preview: it has a separate catalogue and may be protected.
      - name: 29.2 isolated pagination (local production build)
        env:
          PLAYWRIGHT_BASE_URL: ''
          VERCEL_AUTOMATION_BYPASS_SECRET: ''
          DATABASE_URL: postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          RENEWAL_TOKEN_SECRET: e2e-fake-secret-signs-nothing-real
          SITE_URL: https://ci-build-no-es-el-dominio-real.invalid
          R2_BUCKET_PUBLIC_URL: https://fotos-de-prueba.rentas.invalid
          PLAYWRIGHT_WEB_COMMAND: pnpm start
        run: |
          pnpm exec tsx scripts/seed-pagination-e2e.ts
          pnpm build
          pnpm exec playwright test tests/e2e/paginacion-catalogo.spec.ts --project=chromium
          pnpm exec playwright test tests/e2e/paginacion-catalogo.spec.ts --project=crawlability

  budget:
    if: github.event_name == 'push' && (github.ref != 'refs/heads/dev' || vars.CI_DEV_PROFILE != 'critical')
    needs: preview
    runs-on: ubuntu-latest
    # tasks.md 27.4 — the row half of the budget pair. Unlike the byte half
    # above (build-output only, no database), this half needs a real
    # Postgres seeded with the real taxonomy: the defect it guards against
    # (an unbounded read that costs nothing at ten rows and 580x more at
    # 5,813) is invisible against anything smaller. Same image, same health
    # check as the `integration`/`e2e` jobs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    env:
      PREVIEW_BASE_URL: ${{ needs.preview.outputs.url }}
      # Same deliberately fake, unroutable values the `build` job above
      # uses, and for the same reason: src/shared/db/client.ts validates
      # DATABASE_URL at module load, so `pnpm build` needs one present, but
      # this job must never touch a real database either.
      DATABASE_URL: postgresql://ci:ci@ep-ci-build-0000-pooler.invalid.neon.tech/ci?sslmode=require
      AUTH_SECRET: build-time-placeholder-not-a-real-secret
      # `robots.txt` and `sitemap.xml` are PRERENDERED, so `readSiteBaseUrl`
      # runs during the build and not only at request time. Since task 26.10
      # removed its hardcoded production fallback it fails closed (AGENTS.md
      # §7), and without this the export dies on /robots.txt. Vercel needs no
      # equivalent: it sets VERCEL_URL in the build environment, and the real
      # SITE_URL is configured there (26.20). Fixed and fake for the same
      # reason as the two above — a build must not depend on the live domain.
      SITE_URL: https://ci-build-no-es-el-dominio-real.invalid
      # Deliberately not DATABASE_URL, same reasoning as the `integration`
      # job: this bare container is never a Neon pooled endpoint.
      # scripts/budget-rows.ts speaks node-postgres against this directly.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tasks.md 11.17/11.18. Needs no deployment — it reads .next's own
      # build output — which is why it runs before the (deployment-dependent)
      # Lighthouse step below rather than after it. This job builds again
      # rather than downloading the `build` job's artifact because the two
      # jobs run in parallel with no ordering dependency between them, and
      # wiring an artifact hand-off would trade a few seconds of duplicate
      # build time for a real cross-job coupling — not a trade worth making
      # for a job that is already gated to dev/staging pushes.
      - name: Bundle budget (build-output size assertion)
        run: |
          pnpm build
          pnpm run budget:bundle

      # tasks.md 27.4 — the row half, read right after the byte half above
      # so a failure here reads as "budget" and needs no separate file to
      # explain what that means. Same migrations the app ships (not a
      # hand-rolled schema), same reasoning as the `integration` job for why
      # DATABASE_URL is scoped to just this step.
      - name: Apply migrations to the row-budget container
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:migrate

      # Seeds the real taxonomy + demo listings itself (idempotent), then
      # runs every read-path query through the already-wired
      # assertRowBudget guard. Fails loudly — a non-zero exit here, not a
      # silent report — because a guard that only warns is the same silence
      # tasks.md 27.4 exists to end.
      - name: Row budget (read-path query size assertion)
        run: pnpm run budget:rows

      # tasks.md 11.19/11.20. Runs against the real preview deployment
      # resolved by the `preview` job above — this is the one gate in this
      # job that genuinely needs it.
      #
      # The status check in front of it is not ceremony. Until a read-path
      # page exists, the preview's root is a 404 — and a 404 is tiny, so it
      # would sail through every byte budget and report green having verified
      # nothing. This repository has already shipped three checks that could
      # not fail; refusing to measure a page that is not there is how this one
      # avoids becoming the fourth: missing access or a non-200 is a failure.
      - name: Lighthouse budget
        id: lighthouse
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$PREVIEW_BASE_URL" ] || [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error title=Lighthouse budget not measured::Preview URL or automation bypass credential unavailable. No page weight or LCP was checked."
            exit 1
          fi
          # No redirect follows, response body, header dump or credential in argv.
          # curl errors are failures, not a successful empty-page measurement.
          if ! status=$(printf 'x-vercel-protection-bypass: %s\n' "$VERCEL_AUTOMATION_BYPASS_SECRET" | curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' --header @- "$PREVIEW_BASE_URL/"); then
            echo "::error title=Lighthouse probe failed::Preview transport failed; no measurement was made."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error title=Lighthouse budget not measured::Preview root returned HTTP ${status}. No page weight or LCP was checked."
            exit 1
          fi
          # LHCI's puppeteerScript uses puppeteer-core, which cannot infer a
          # browser binary. Resolve one only after the preview is measurable;
          # a reachable preview must fail rather than silently skip Lighthouse.
          if [ -n "${CHROME_PATH:-}" ] && [ -x "$CHROME_PATH" ]; then
            chrome="$CHROME_PATH"
          else
            chrome=""
            for candidate in google-chrome google-chrome-stable chromium; do
              if path=$(command -v "$candidate") && [ -x "$path" ]; then
                chrome="$path"
                break
              fi
            done
          fi
          if [ -z "$chrome" ]; then
            echo "::error title=Lighthouse Chrome unavailable::No executable Chrome found in CHROME_PATH or runner PATH. Preview root returned 200; budget was not measured."
            exit 1
          fi
          export CHROME_PATH="$chrome"
          pnpm run budget:lighthouse --collect.puppeteerScript=scripts/lighthouse-preview-auth.cjs

      - name: Extract sanitized Lighthouse diagnostic
        id: lighthouse_diagnostic
        if: ${{ !cancelled() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure') }}
        run: node scripts/lighthouse-summary.mjs

      - name: Preserve sanitized Lighthouse diagnostic
        if: ${{ !cancelled() && steps.lighthouse_diagnostic.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: .lighthouseci/diagnostic.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
